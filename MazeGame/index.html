<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Maze Game - Escape in 10 Minutes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        /* Main Menu Screen */
        #mainMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            flex-direction: column;
        }

        #mainMenu h1 {
            font-size: 3.5em;
            color: #00ff00;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #00ff00;
        }

        #mainMenu p {
            color: #aaa;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        #mainMenu button {
            padding: 15px 40px;
            font-size: 1.2em;
            background: #00ff00;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #mainMenu button:hover {
            background: #00cc00;
            transform: scale(1.05);
            box-shadow: 0 0 15px #00ff00;
        }

        /* In-game UI */
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            z-index: 10;
            font-size: 18px;
        }

        .info div {
            margin: 10px 0;
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 15px;
            border: 1px solid #00ff00;
            border-radius: 5px;
            z-index: 10;
            font-size: 14px;
        }

        /* Game Over Screen */
        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.98);
            padding: 50px;
            border: 3px solid #00ff00;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
            color: white;
            font-size: 20px;
        }

        .game-over h2 {
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00ff00;
        }

        .game-over p {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #ccc;
        }

        .game-over button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.1em;
            background: #00ff00;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .game-over button:hover {
            background: #00cc00;
            transform: scale(1.05);
        }

        /* Red screen effect when killed */
        #redScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: red;
            display: none;
            z-index: 2000;
        }

        /* Jumpscare overlay */
        #jumpscareOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            display: none;
            z-index: 2000;
            align-items: center;
            justify-content: center;
            font-size: 72px;
        }

        /* Hide elements during game */
        .info, .instructions {
            display: none;
        }

        #gameInProgress .info,
        #gameInProgress .instructions {
            display: block;
        }

        /* Crosshair cursor */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 999;
            display: none;
        }

        #crosshair svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Main Menu Screen -->
    <div id="mainMenu">
        <h1>🌀 MAZE ESCAPE</h1>
        <p>Find the button and escape in 10 minutes...</p>
        <button onclick="startGame()">PLAY</button>
    </div>

    <!-- Crosshair cursor -->
    <div id="crosshair">
        <svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
            <line x1="15" y1="5" x2="15" y2="10" stroke="#00ff00" stroke-width="2"/>
            <line x1="25" y1="15" x2="20" y2="15" stroke="#00ff00" stroke-width="2"/>
            <line x1="15" y1="25" x2="15" y2="20" stroke="#00ff00" stroke-width="2"/>
            <line x1="5" y1="15" x2="10" y2="15" stroke="#00ff00" stroke-width="2"/>
            <circle cx="15" cy="15" r="3" fill="none" stroke="#00ff00" stroke-width="1"/>
        </svg>
    </div>

    <!-- In-game UI -->
    <div id="gameInProgress">
        <div class="info">
            <div>⏱️ Time: <span id="timer">10:00</span></div>
            <div>🔘 Button: <span id="buttonStatus">❌ Not Found</span></div>
            <div>🚪 Exit: <span id="exitStatus">🔒 Locked</span></div>
        </div>

        <div class="instructions">
            <strong>🎮 CONTROLS:</strong><br>
            WASD - Move | Space - Jump<br>
            E - Interact | Mouse - Look Around<br>
            Find the correct button and reach the exit!
        </div>
    </div>

    <!-- Game Over Screen -->
    <div class="game-over" id="gameOverScreen">
        <h2 id="gameOverTitle">Game Over</h2>
        <p id="gameOverMessage"></p>
        <button onclick="restartGame()">PLAY AGAIN</button>
    </div>

    <!-- Visual Effects -->
    <div id="redScreen"></div>
    <div id="jumpscareOverlay">😱 SCARY!</div>

    <!-- Audio Elements -->
    <audio id="bgMusic" loop preload="auto">
        <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQIAAAAAAA==" type="audio/wav">
    </audio>
    <audio id="scareSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQIAAAAAAA==" type="audio/wav">
    </audio>
    <audio id="successSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQIAAAAAAA==" type="audio/wav">
    </audio>

    <script src="script.js"></script>
</body>
</html>
