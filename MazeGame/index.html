<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Maze Escape Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        .ui-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            color: white;
            font-size: 1.1em;
            z-index: 10;
            border: 2px solid #667eea;
            min-width: 250px;
        }

        .ui-item {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ui-label {
            font-weight: bold;
            color: #667eea;
        }

        .ui-value {
            color: #fff;
            font-size: 1.2em;
        }

        .timer {
            color: #fff;
        }

        .timer.warning {
            animation: pulse 0.5s infinite;
            color: #e74c3c;
        }

        @keyframes pulse {
            0%, 100% { color: #fff; }
            50% { color: #e74c3c; }
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 10px;
            color: #aaa;
            font-size: 0.9em;
            border: 1px solid #667eea;
            z-index: 10;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            z-index: 1000;
            min-width: 400px;
            border: 3px solid #667eea;
        }

        .game-over h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .game-over.win {
            color: #27ae60;
        }

        .game-over.win h2 {
            color: #27ae60;
        }

        .game-over.lose {
            color: #e74c3c;
        }

        .game-over.lose h2 {
            color: #e74c3c;
        }

        .game-over p {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #fff;
        }

        .game-over button {
            padding: 12px 30px;
            font-size: 1.1em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .game-over button:hover {
            background: #764ba2;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }

        .help-text {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 10px;
            color: #aaa;
            font-size: 0.9em;
            border: 1px solid #667eea;
            z-index: 10;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>

    <div class="ui-overlay">
        <h3 style="margin-bottom: 15px; color: #667eea;">🎮 Maze Escape</h3>
        <div class="ui-item">
            <span class="ui-label">⏱️ Time Left:</span>
            <span class="timer ui-value" id="timer">20:00</span>
        </div>
        <div class="ui-item">
            <span class="ui-label">🔘 Button:</span>
            <span class="ui-value" id="buttonStatus">❌ Not Found</span>
        </div>
        <div class="ui-item">
            <span class="ui-label">🚪 Exit:</span>
            <span class="ui-value" id="exitStatus">🔒 Locked</span>
        </div>
    </div>

    <div class="help-text">
        <strong>Controls:</strong><br>
        W/A/S/D - Move<br>
        Mouse - Look Around<br>
        Click - Collect Button<br>
        Space - Jump
    </div>

    <div class="instructions">
        <strong>Objective:</strong> Find the golden button 🔘 and click it to unlock the exit 🚪, then escape!<br>
        <strong>Time Limit:</strong> 20 minutes or you lose!
    </div>

    <div class="game-over" id="gameOverScreen">
        <h2 id="gameOverTitle">Game Over</h2>
        <p id="gameOverMessage"></p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
